:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;dementia-pattern-summary&quot;&gt;
  &lt;style&gt;
    #dementia-pattern-summary{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--foreground);max-width:1000px;margin:auto;padding:8px 2px 22px;line-height:1.35}
    #dementia-pattern-summary *{box-sizing:border-box}
    #dementia-pattern-summary header{padding:22px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(130deg,color-mix(in srgb,var(--viz-series-1) 12%,transparent),color-mix(in srgb,var(--viz-series-3) 7%,transparent))}
    #dementia-pattern-summary h1{font-size:clamp(25px,4vw,39px);line-height:1.06;letter-spacing:-.04em;margin:0 0 7px}
    #dementia-pattern-summary header p{max-width:760px;margin:0;color:color-mix(in srgb,var(--foreground) 70%,transparent);font-size:14px}
    #dementia-pattern-summary .warning{margin-top:12px;padding:9px 11px;border-left:4px solid var(--viz-series-4);background:color-mix(in srgb,var(--viz-series-4) 10%,transparent);font-size:12px}
    #dementia-pattern-summary .layout{display:grid;grid-template-columns:290px 1fr;gap:13px;margin-top:14px}
    #dementia-pattern-summary .selector,#dementia-pattern-summary .detail{border:1px solid var(--border);border-radius:16px;padding:14px;background:color-mix(in srgb,var(--background) 94%,transparent)}
    #dementia-pattern-summary .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:color-mix(in srgb,var(--foreground) 60%,transparent);font-weight:800;margin:0 0 8px}
    #dementia-pattern-summary .patterns{display:grid;gap:5px}
    #dementia-pattern-summary button.pattern{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:inherit;padding:9px 10px;border-radius:10px;cursor:pointer;font:inherit;font-size:12px;font-weight:650}
    #dementia-pattern-summary button.pattern:hover{border-color:var(--border)}
    #dementia-pattern-summary button.pattern[aria-selected=&quot;true&quot;]{background:var(--foreground);color:var(--background)}
    #dementia-pattern-summary h2{font-size:24px;line-height:1.1;letter-spacing:-.025em;margin:0}
    #dementia-pattern-summary .suggests{font-size:13px;margin:8px 0 14px;padding:10px 11px;border-radius:11px;background:color-mix(in srgb,var(--viz-series-2) 10%,transparent)}
    #dementia-pattern-summary .domain-bars{display:grid;gap:7px;margin:12px 0 17px}
    #dementia-pattern-summary .bar{display:grid;grid-template-columns:100px 1fr 58px;gap:8px;align-items:center;font-size:11px}
    #dementia-pattern-summary .track{height:8px;background:color-mix(in srgb,var(--foreground) 10%,transparent);border-radius:9px;overflow:hidden}
    #dementia-pattern-summary .fill{height:100%;border-radius:9px;background:var(--viz-series-1);transition:width .2s}
    #dementia-pattern-summary .level{text-align:right;color:color-mix(in srgb,var(--foreground) 62%,transparent)}
    #dementia-pattern-summary .columns{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    #dementia-pattern-summary h3{font-size:12px;margin:0 0 5px;text-transform:uppercase;letter-spacing:.07em}
    #dementia-pattern-summary ul{font-size:12px;margin:0;padding-left:18px}#dementia-pattern-summary li{margin:5px 0}
    #dementia-pattern-summary .rule{margin-top:13px;border-top:1px solid var(--border);padding-top:11px;font-size:11px;color:color-mix(in srgb,var(--foreground) 65%,transparent)}
    #dementia-pattern-summary .bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
    #dementia-pattern-summary .key{border:1px solid var(--border);border-radius:12px;padding:10px;font-size:11px}.key strong{display:block;margin-bottom:3px;font-size:12px}
    #dementia-pattern-summary .glossary{margin-top:18px;border-top:1px solid var(--border);padding-top:16px}
    #dementia-pattern-summary .glossary h2{font-size:22px;margin:0 0 4px}
    #dementia-pattern-summary .glossary-intro{font-size:12px;color:color-mix(in srgb,var(--foreground) 64%,transparent);margin:0 0 12px}
    #dementia-pattern-summary .glossary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 14px}
    #dementia-pattern-summary details.term{border-bottom:1px solid var(--border);padding:7px 0}
    #dementia-pattern-summary details.term summary{cursor:pointer;font-size:12px;font-weight:650;list-style-position:outside;margin-left:16px}
    #dementia-pattern-summary details.term p{font-size:11px;margin:6px 0 2px 16px;color:color-mix(in srgb,var(--foreground) 72%,transparent)}
    @media(max-width:720px){#dementia-pattern-summary .layout{grid-template-columns:1fr}#dementia-pattern-summary .patterns{grid-template-columns:repeat(2,minmax(0,1fr))}#dementia-pattern-summary .columns,#dementia-pattern-summary .bottom,#dementia-pattern-summary .glossary-grid{grid-template-columns:1fr}#dementia-pattern-summary .bar{grid-template-columns:84px 1fr 50px}}
  &lt;/style&gt;
  &lt;header&gt;
    &lt;h1&gt;Cognitive pattern →&lt;br&gt;subtype hypothesis&lt;/h1&gt;
    &lt;p&gt;Select the dominant pattern. Compare domain shape with clinical clues and mimics before forming a differential.&lt;/p&gt;
    &lt;div class=&quot;warning&quot;&gt;&lt;strong&gt;Pattern recognition is not diagnosis.&lt;/strong&gt; Acute or fluctuating confusion, reduced alertness, or new focal neurological symptoms requires urgent assessment.&lt;/div&gt;
  &lt;/header&gt;
  &lt;main class=&quot;layout&quot;&gt;
    &lt;section class=&quot;selector&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;Dominant test pattern&lt;/p&gt;&lt;div id=&quot;pattern-list&quot; class=&quot;patterns&quot;&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;section class=&quot;detail&quot; aria-live=&quot;polite&quot;&gt;
      &lt;p class=&quot;eyebrow&quot;&gt;Selected pattern&lt;/p&gt;&lt;h2 id=&quot;title&quot;&gt;&lt;/h2&gt;&lt;div id=&quot;suggests&quot; class=&quot;suggests&quot;&gt;&lt;/div&gt;
      &lt;div id=&quot;bars&quot; class=&quot;domain-bars&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;columns&quot;&gt;
        &lt;div&gt;&lt;h3&gt;Supporting clues&lt;/h3&gt;&lt;ul id=&quot;clues&quot;&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h3&gt;Check mimics / alternatives&lt;/h3&gt;&lt;ul id=&quot;mimics&quot;&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div id=&quot;rule&quot; class=&quot;rule&quot;&gt;&lt;/div&gt;
    &lt;/section&gt;
  &lt;/main&gt;
  &lt;section class=&quot;bottom&quot;&gt;
    &lt;div class=&quot;key&quot;&gt;&lt;strong&gt;MCI vs dementia&lt;/strong&gt;The cognitive shape may be similar. Dementia requires decline that interferes with independence.&lt;/div&gt;
    &lt;div class=&quot;key&quot;&gt;&lt;strong&gt;Memory mechanism&lt;/strong&gt;Poor recognition plus recall supports storage failure; strong cue benefit leans toward retrieval difficulty.&lt;/div&gt;
    &lt;div class=&quot;key&quot;&gt;&lt;strong&gt;Mixed pathology&lt;/strong&gt;Overlapping amnestic, executive, visuospatial or fluctuation features often reflect more than one contributor.&lt;/div&gt;
  &lt;/section&gt;
  &lt;section class=&quot;glossary&quot;&gt;
    &lt;h2&gt;Plain-language glossary&lt;/h2&gt;
    &lt;p class=&quot;glossary-intro&quot;&gt;Open a term for a short clinical definition.&lt;/p&gt;
    &lt;div class=&quot;glossary-grid&quot;&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Agrammatism&lt;/summary&gt;&lt;p&gt;Difficulty producing or understanding normal grammar. Speech may become short and “telegraphic,” with missing connecting words or incorrect word endings.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Semantic / semantic memory&lt;/summary&gt;&lt;p&gt;Knowledge of what words, objects and concepts mean—such as knowing that a lemon is a fruit. It is different from remembering a particular event.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Episodic memory&lt;/summary&gt;&lt;p&gt;Memory for personally experienced events tied to a time and place, including recently learned information.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Encoding&lt;/summary&gt;&lt;p&gt;Taking in and learning new information. Poor attention or comprehension can prevent information from being encoded properly.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Storage&lt;/summary&gt;&lt;p&gt;Keeping learned information over time. Rapid loss despite adequate learning can suggest a storage problem.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Retrieval&lt;/summary&gt;&lt;p&gt;Bringing stored information back to mind. Retrieval difficulty may improve when choices, categories or other cues are provided.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Cueing&lt;/summary&gt;&lt;p&gt;Providing a hint to support recall—for example, giving the category of the item. Improvement with cues can suggest retrieval rather than storage difficulty.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Recognition&lt;/summary&gt;&lt;p&gt;Identifying previously learned information when it is presented among choices, rather than recalling it without help.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Executive function&lt;/summary&gt;&lt;p&gt;Mental control skills used to plan, organize, switch strategies, solve problems, resist automatic responses and monitor mistakes.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Set-shifting&lt;/summary&gt;&lt;p&gt;Changing flexibly from one rule, task or line of thought to another. It is one component of executive function.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Processing speed&lt;/summary&gt;&lt;p&gt;How quickly a person can understand information and produce an accurate response. Slowness is not the same as lack of knowledge.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Attention&lt;/summary&gt;&lt;p&gt;The ability to focus, sustain concentration and handle competing information. Poor attention can lower performance across many other domains.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Verbal fluency&lt;/summary&gt;&lt;p&gt;Rapidly generating words under a rule, such as words from a category. Performance draws on language, processing speed and executive search.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Visuospatial ability&lt;/summary&gt;&lt;p&gt;Understanding where objects are in space and how parts relate to one another—for example, navigation or copying a design.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Visuoperceptual ability&lt;/summary&gt;&lt;p&gt;Correctly recognizing and interpreting what is seen, even when eyesight itself is adequate.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Praxis / apraxia&lt;/summary&gt;&lt;p&gt;Praxis is the ability to perform learned purposeful actions. Apraxia is difficulty carrying them out despite sufficient strength and basic understanding.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Agnosia&lt;/summary&gt;&lt;p&gt;Difficulty recognizing a familiar object, face, sound or other stimulus despite adequate basic sensation.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Apraxia of speech&lt;/summary&gt;&lt;p&gt;Difficulty planning the movements required for speech. Words may sound effortful, distorted or inconsistently pronounced.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Dysarthria&lt;/summary&gt;&lt;p&gt;Unclear or altered speech caused by weakness, stiffness or poor coordination of the speech muscles—not primarily a language problem.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Disinhibition&lt;/summary&gt;&lt;p&gt;Reduced control over socially inappropriate, impulsive or risky behaviour compared with the person’s previous character.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Apathy&lt;/summary&gt;&lt;p&gt;Reduced motivation, initiative or interest. It is not automatically depression and may occur without sadness.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Parkinsonism&lt;/summary&gt;&lt;p&gt;A syndrome involving features such as slowness of movement, stiffness, tremor or impaired balance. It has several possible causes.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Collateral history&lt;/summary&gt;&lt;p&gt;Information from someone who knows the person well, used to clarify change from baseline, progression and everyday function.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;IADLs&lt;/summary&gt;&lt;p&gt;Instrumental activities of daily living: complex tasks needed for independence, such as finances, medications, cooking, shopping and transport.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Delirium&lt;/summary&gt;&lt;p&gt;An acute, often fluctuating disturbance of attention, awareness and cognition caused by illness, medication, substances or another physiological problem. It requires prompt assessment.&lt;/p&gt;&lt;/details&gt;
      &lt;details class=&quot;term&quot;&gt;&lt;summary&gt;Mixed pathology&lt;/summary&gt;&lt;p&gt;More than one disease process contributing to cognitive decline—for example, Alzheimer and vascular changes occurring together.&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/section&gt;
  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;dementia-pattern-summary&#x27;);
    const domains=[&#x27;Memory&#x27;,&#x27;Executive&#x27;,&#x27;Attention&#x27;,&#x27;Language&#x27;,&#x27;Visuospatial&#x27;,&#x27;Orientation&#x27;];
    const data=[
      {title:&#x27;Amnestic — storage type&#x27;,short:&#x27;Amnestic storage&#x27;,scores:[3,1,1,1,1,2],suggests:&#x27;Most suggestive of an Alzheimer clinical syndrome; also consider other hippocampal or temporal pathology.&#x27;,clues:[&#x27;Poor learning and delayed recall&#x27;,&#x27;Rapid forgetting&#x27;,&#x27;Little benefit from cueing or recognition&#x27;,&#x27;Progressive repetition, missed appointments or getting lost&#x27;],mimics:[&#x27;Delirium or poor attention during encoding&#x27;,&#x27;Sedating or anticholinergic medication&#x27;,&#x27;Sleep disorder, depression or severe anxiety&#x27;],rule:&#x27;A cognitive profile can suggest an Alzheimer syndrome, but current criteria define Alzheimer disease biologically; biomarkers and full clinical context determine aetiology.&#x27;},
      {title:&#x27;Retrieval / dysexecutive memory&#x27;,short:&#x27;Retrieval memory&#x27;,scores:[2,3,2,1,1,1],suggests:&#x27;Raises vascular, frontal–subcortical, Parkinsonian or mood-related contributions.&#x27;,clues:[&#x27;Free recall poor but recognition/cueing better&#x27;,&#x27;Set-shifting and working memory impaired&#x27;,&#x27;Slowed output or reduced verbal fluency&#x27;],mimics:[&#x27;Depression, fatigue or sleep disturbance&#x27;,&#x27;Medication effects&#x27;,&#x27;Motor or speech slowing contaminating timed tasks&#x27;],rule:&#x27;Retrieval benefit is supportive, not definitive. Brief screens usually cannot cleanly separate storage from retrieval.&#x27;},
      {title:&#x27;Attention–executive–visuospatial&#x27;,short:&#x27;DLB-like pattern&#x27;,scores:[1,3,3,1,3,1],suggests:&#x27;Suggestive of dementia with Lewy bodies when the characteristic clinical features accompany it.&#x27;,clues:[&#x27;Early fluctuations in attention or arousal&#x27;,&#x27;Recurrent formed visual hallucinations&#x27;,&#x27;REM-sleep behaviour disorder&#x27;,&#x27;Spontaneous parkinsonism&#x27;],mimics:[&#x27;Delirium—especially with acute fluctuation&#x27;,&#x27;Visual impairment&#x27;,&#x27;Medication or sleep effects&#x27;],rule:&#x27;In DLB, attention, executive and visual-processing deficits are often disproportionate to memory and naming; the cognitive pattern alone is insufficient.&#x27;},
      {title:&#x27;Executive / processing-speed dominant&#x27;,short:&#x27;Vascular-like pattern&#x27;,scores:[1,3,3,1,1,1],suggests:&#x27;Suggestive of vascular cognitive impairment, particularly subcortical small-vessel disease.&#x27;,clues:[&#x27;Slowed processing and set-shifting&#x27;,&#x27;Stepwise or stroke-linked decline&#x27;,&#x27;Focal neurological or gait findings&#x27;,&#x27;Relevant vascular disease on imaging&#x27;],mimics:[&#x27;Parkinsonian disorders&#x27;,&#x27;Depression or apathy&#x27;,&#x27;Motor, visual or speech impairment&#x27;],rule:&#x27;Vascular profiles are highly variable. A vascular aetiology requires evidence linking cerebrovascular disease to the cognitive disorder.&#x27;},
      {title:&#x27;Behavioural / social-executive&#x27;,short:&#x27;Behavioural FTD&#x27;,scores:[1,3,1,1,1,1],suggests:&#x27;Suggestive of behavioural-variant frontotemporal dementia when early personality or conduct change dominates.&#x27;,clues:[&#x27;Disinhibition, apathy or loss of empathy&#x27;,&#x27;Compulsive behaviour or dietary change&#x27;,&#x27;Poor judgment with limited insight&#x27;,&#x27;Memory may look relatively preserved early&#x27;],mimics:[&#x27;Primary psychiatric disorder&#x27;,&#x27;Medication, substance or mood effects&#x27;,&#x27;Frontal tumour, stroke or traumatic injury&#x27;],rule:&#x27;Common brief screens under-sample social cognition and behaviour, so a near-normal total does not exclude behavioural FTD.&#x27;},
